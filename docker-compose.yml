services:
  flutterzakhireh:
    build: .
    image: flutterzakhireh:latest
    container_name: flutterzakhireh
    restart: unless-stopped
    ports:
      # Expose port 8811 for proxy and dashboard access
      - "8811:8811"
    volumes:
      # Persist downloaded packages to the host ./data/packages directory
      - ./data/packages:/data/packages
      # Persist uploaded specs, workspaces, outputs, and logs (survives restarts)
      - ./data/specs:/data/specs
      # To enable spec generation, place a Flutter/Dart SDK on the host at one
      # of the auto-detected paths (/opt/flutter or /opt/dart-sdk). Missing
      # host paths are auto-created as empty dirs by compose (harmless).
      # The mount must stay writable and owned by the app user for flutter's
      # engine stamps: chown -R 65532:65532 /opt/flutter
      - /opt/flutter:/opt/flutter
      # - /opt/dart-sdk:/opt/dart-sdk
    environment:
      # Configure FlutterZakhireh settings
      - FLUTTERZAKHIREH_PORT=:8811
      - FLUTTERZAKHIREH_DATA_DIR=/data/packages
      - FLUTTERZAKHIREH_SPECS_DIR=/data/specs
      # Writable HOME and pub cache for SDK runs inside the container
      - HOME=/data/home
      - PUB_CACHE=/data/pub-cache
      # Artifact mirror for SDK downloads (empty/override when Google is blocked,
      # e.g. FLUTTER_STORAGE_BASE_URL=https://storage.flutter-io.cn in .env)
      - FLUTTER_STORAGE_BASE_URL=${FLUTTER_STORAGE_BASE_URL:-https://storage.googleapis.com}
      # Or point at the SDK explicitly:
      # - FLUTTERZAKHIREH_FLUTTER_BIN=/opt/flutter/bin/flutter
      # Upstream to fetch packages from (default: pub.dev)
      - FLUTTERZAKHIREH_UPSTREAM=${FLUTTERZAKHIREH_UPSTREAM:-https://pub.dev}
      # Private package glob patterns (skip sumdb):
      # - FLUTTER_NO_SUMDB=*.corp.example.com
      # - FLUTTERZAKHIREH_ALLOW=my_private_pkg,my_other_pkg
      # - FLUTTERZAKHIREH_DENY=forbidden_pkg
